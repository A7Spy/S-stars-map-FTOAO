<script>
  const starMap = document.getElementById('starMap');
  const tooltip = document.getElementById('tooltip');

  const starNames = [
    "Altair", "Sirius", "Vega", "Canopus", "Aldebaran", "Capella", "Rigel", "Bellatrix", "Betelgeuse", 
    "Fomalhaut", "Castor", "Pollux", "Spica", "Sadalsuud", "Tarazed", "Procyon", "Deneb", "Alnitak", 
    "Alhena", "Regulus", "Mintaka", "Arcturus", "Zubeneschamali", "Denebola", "Dubhe", "Polaris", 
    "Caph", "Acubens", "Kaus Australis", "Antares", "Thuban", "Sadr", "Alnair", "Alcor", "Mizar", 
    "Algol", "Alpheratz", "Hamal", "Markab", "Enif"
  ];

  // Fixed 100 stars with positions, sizes, and names
  const starData = Array.from({length: 100}, (_, i) => {
    return {
      top: (Math.floor(Math.random() * 95) + 1) + '%',   // 1% - 95%
      left: (Math.floor(Math.random() * 95) + 1) + '%',  // 1% - 95%
      size: (Math.random() * 4 + 2).toFixed(1),          // 2px - 6px
      name: starNames[i % starNames.length]             // recycle names
    };
  });

  starData.forEach(data => {
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.width = data.size + 'px';
    star.style.height = data.size + 'px';
    star.style.top = data.top;
    star.style.left = data.left;
    star.style.background = `rgba(255,255,255,0.8)`;
    star.style.boxShadow = `0 0 ${data.size * 3}px rgba(255,255,255,0.8)`;
    star.setAttribute('data-name', data.name);
    starMap.appendChild(star);
  });

  const stars = document.querySelectorAll('.star');

  stars.forEach(star => {
    star.addEventListener('mouseenter', e => {
      tooltip.textContent = star.getAttribute('data-name');
      tooltip.style.opacity = 1;
    });
    star.addEventListener('mousemove', e => {
      tooltip.style.top = (e.pageY + 15) + 'px';
      tooltip.style.left = (e.pageX + 15) + 'px';
    });
    star.addEventListener('mouseleave', () => {
      tooltip.style.opacity = 0;
    });
  });
</script>
